<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARDUM FF SHOP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff}
header{padding:24px 16px;text-align:center;background:linear-gradient(135deg,#151b35,#10172d);border-bottom:1px solid #26304f}
h1{margin:0;font-size:28px}header p{color:#aeb8d6;margin:8px 0 0}
.container{max-width:1000px;margin:auto;padding:18px}
#status{text-align:center;color:#9eabd0;margin:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#151c32;border:1px solid #283353;border-radius:16px;padding:18px;box-shadow:0 8px 25px #0003}
.emoji{font-size:42px}.card h2{font-size:20px;margin:10px 0}.desc{color:#aeb8d6;min-height:40px}.price{font-size:24px;font-weight:700;margin:15px 0;color:#65e6a5}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.buy{width:100%;background:#00d084;color:#07130d}.buy:hover{background:#20e59b}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.show{display:flex}.box{width:min(480px,100%);background:#151c32;border:1px solid #303d62;border-radius:18px;padding:20px}
.box h2{margin-top:0}input,textarea{width:100%;padding:13px;margin:7px 0 12px;border-radius:10px;border:1px solid #39466b;background:#0d1427;color:#fff;font-size:16px}
textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px}.row button{flex:1}.cancel{background:#303a59;color:#fff}.submit{background:#00d084;color:#07130d}
.message{text-align:center;margin-top:12px;min-height:20px}
.empty{text-align:center;color:#aeb8d6;padding:40px}
footer{text-align:center;color:#7783a5;padding:30px}
</style>
</head>
<body>
<header><h1>🎮 PARDUM FF SHOP</h1><p>Free Fire Services • Fast & Trusted</p></header>
<div class="container">
  <div id="status">Loading products...</div>
  <div id="products" class="grid"></div>
</div>
<footer>© PARDUM FF SHOP</footer>

<div id="modal" class="modal">
  <div class="box">
    <h2 id="modalTitle">Place Order</h2>
    <p id="modalPrice"></p>
    <form id="orderForm">
      <input id="customerName" placeholder="Your name" required maxlength="80">
      <input id="contact" placeholder="WhatsApp / Phone / Contact" required maxlength="80">
      <textarea id="note" placeholder="UID, package details or note" maxlength="500"></textarea>
      <div class="row">
        <button type="button" class="cancel" id="closeBtn">Cancel</button>
        <button type="submit" class="submit">Submit Order</button>
      </div>
      <div id="message" class="message"></div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBDn7Nf1zPsZKklJ-GKwVXqp1SM5kNqbU4",
  authDomain: "pardum-ff-shop.firebaseapp.com",
  projectId: "pardum-ff-shop",
  storageBucket: "pardum-ff-shop.firebasestorage.app",
  messagingSenderId: "93673451331",
  appId: "1:93673451331:web:c30b90ab737753d85cc9f6",
  measurementId: "G-9YSYW9SMDN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const productsEl = document.getElementById("products");
const statusEl = document.getElementById("status");
const modal = document.getElementById("modal");
const form = document.getElementById("orderForm");
let selectedProduct = null;

function safeText(v){ return v == null ? "" : String(v); }
function productName(d){
  return d.name ?? d["Free Fire Service"] ?? "Free Fire Service";
}

onSnapshot(collection(db, "products"), (snapshot) => {
  productsEl.innerHTML = "";
  const products = [];
  snapshot.forEach(s => {
    const d = s.data();
    if (d.active !== false) products.push({id:s.id, ...d});
  });
  statusEl.textContent = products.length ? `${products.length} service(s) available` : "No products available";
  if(!products.length){
    productsEl.innerHTML = '<div class="empty">No services available right now.</div>';
    return;
  }
  products.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    const price = Number(p.price ?? 0);
    card.innerHTML = `
      <div class="emoji">${safeText(p.emoji || "🎮")}</div>
      <h2>${safeText(productName(p))}</h2>
      <div class="desc">${safeText(p.description || "Free Fire service")}</div>
      <div class="price">₹${price.toFixed(2)}</div>
      <button class="buy">Order Now</button>`;
    card.querySelector(".buy").onclick = () => openOrder(p);
    productsEl.appendChild(card);
  });
}, (err) => {
  console.error(err);
  statusEl.textContent = "Could not load products. Check Firestore Rules.";
});

function openOrder(p){
  selectedProduct = p;
  document.getElementById("modalTitle").textContent = "Order: " + productName(p);
  document.getElementById("modalPrice").textContent = "Price: ₹" + Number(p.price ?? 0).toFixed(2);
  document.getElementById("message").textContent = "";
  form.reset();
  modal.classList.add("show");
}
document.getElementById("closeBtn").onclick = () => modal.classList.remove("show");
modal.onclick = e => { if(e.target === modal) modal.classList.remove("show"); };

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if(!selectedProduct) return;
  const msg = document.getElementById("message");
  msg.textContent = "Submitting...";
  try{
    const uid = (crypto.randomUUID ? crypto.randomUUID() : "guest-" + Date.now() + "-" + Math.random().toString(36).slice(2));
    await addDoc(collection(db, "orders"), {
      productId: selectedProduct.id,
      productName: productName(selectedProduct),
      price: Number(selectedProduct.price ?? 0),
      customerName: document.getElementById("customerName").value.trim(),
      uid: uid,
      contact: document.getElementById("contact").value.trim(),
      note: document.getElementById("note").value.trim(),
      status: "pending",
      createdAt: serverTimestamp()
    });
    msg.textContent = "✅ Order submitted successfully!";
    form.reset();
    setTimeout(() => modal.classList.remove("show"), 1200);
  }catch(err){
    console.error(err);
    msg.textContent = "❌ Order failed. Please try again.";
  }
});
</script>
</body>
</html>
